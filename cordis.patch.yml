# 额度中心：只挂载自己的插件，不修改模型与其他插件。
- insert:
    - id: quota-center
      name: dsh-quota-center
      config:
        refreshMs: 60000
        auto: false
        providers:
          - id: chatgpt
            label: ChatGPT 订阅（Codex）
            localAuth: codex
            endpoint: https://chatgpt.com/backend-api/wham/usage
            format: chatgpt-subscription
          - id: deepseek
            label: DeepSeek
            credential: DEEPSEEK_API_KEY
            endpoint: https://api.deepseek.com/user/balance
            format: deepseek-balance
          - id: opencode-go
            label: OpenCode Go
            credential: OPENCODE_GO_API_KEY
            endpoint: https://opencode.ai/zen/go/v1/usage
            format: opencode-usage
            windowLabels:
              rolling: 5 小时
              weekly: 每周
              monthly: 每月
